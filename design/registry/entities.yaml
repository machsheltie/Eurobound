# Eurobound entity registry
#
# Purpose: one source of truth for names, ids, numbers and formulas that appear
# in more than one doc. Each entry holds the canonical value, the ruling or
# path:line that fixed it, and where it is restated. The consistency-check skill
# greps the docs for each entry and flags any restatement that disagrees.
#
# Rules:
#   - The registry never invents a value. An entry exists only after an author
#     ruling or an approved doc line. Unruled values are `pending: <ruling bead>`.
#   - Every value carries its source line (path:line) or ruling id.
#   - Not engine data: game/assets/data/ stays the runtime source.
#   - The rulings ledger (docs/superpowers/NEXT_WORK.md) stays the authority.
#     "ledger" below means that file.
#   - Maintainer: the agent applying a ruling adds or updates the entry in the
#     same change, citing the ruling id, with the author's OK per batch. The
#     author did not pick a maintainer; this is the proposal's default
#     (docs/superpowers/proposals/2026-11-12-entity-registry-format.md, Q3 a).
#
# Format: Option A (one file), approved on the Eurobound Desk 2026-11-12
# (orch-registry-format). Taproom doc = design/worlds/debaucheryville/the_absinthium_taproom.md
# v43 proposal = docs/superpowers/proposals/2026-11-12-v43-design-proposals.md

