<style id="css">
/* Layout: one reading column — crew status strip, open questions (the work), answered log, render gallery at the foot. */
:root{
  --bg:#eceee7; --surface:#f8f9f4; --line:#cfd3c6; --fg:#1c2018; --muted:#5d6555;
  --green:#3d7a19; --violet:#6a3db0; --warn:#9a5b00; --ok:#2f6f2a;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11140f; --surface:#191d16; --line:#2e3529; --fg:#e3e8da; --muted:#9aa38f;
  --green:#9ad65a; --violet:#b48ef2; --warn:#e3a54a; --ok:#86c96f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11140f; --surface:#191d16; --line:#2e3529; --fg:#e3e8da; --muted:#9aa38f;
  --green:#9ad65a; --violet:#b48ef2; --warn:#e3a54a; --ok:#86c96f; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;display:grid;gap:36px}
header{display:grid;gap:6px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,54px);line-height:.95;letter-spacing:.01em;margin:0;text-wrap:balance}
h1 .g{color:var(--green)} h1 .v{color:var(--violet)}
.sub{color:var(--muted);margin:0;max-width:62ch}
h2{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0 0 12px;text-transform:uppercase}
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.el{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.el .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.el .name{font-weight:700}
.el .meta{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.s-queued{color:var(--muted)} .s-working{color:var(--violet)} .s-holding{color:var(--warn)}
.s-review,.s-rework{color:var(--warn)} .s-complete{color:var(--ok)}
.q{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:6px;padding:16px;display:grid;gap:10px;min-width:0}
.q .who{display:flex;flex-wrap:wrap;gap:8px 14px}
.q .text{font-size:16.5px;font-weight:700;margin:0;max-width:70ch}
.q .ctx{margin:0;color:var(--muted);max-width:70ch;white-space:pre-line}
.q ul{margin:0;padding-left:20px;color:var(--fg)}
.q label{font-family:var(--mono);font-size:12px;color:var(--muted)}
textarea{width:100%;box-sizing:border-box;min-height:84px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;resize:vertical}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.qs{display:grid;gap:14px}
.bar{position:sticky;bottom:0;padding-block:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:4px;border:1px solid var(--green);background:var(--green);color:var(--bg);padding:10px 18px}
button:disabled{opacity:.45;cursor:not-allowed}
.note{color:var(--muted);font-size:13.5px}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:18px}
details.log{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
details.log summary{cursor:pointer;font-weight:700}
.ans{border-top:1px solid var(--line);padding-block:10px;display:grid;gap:4px}
.ans .a{color:var(--green);white-space:pre-line}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.shot{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:grid;min-width:0}
.shot button{all:unset;cursor:zoom-in;display:block}
.shot button:focus-visible{outline:2px solid var(--violet)}
.shot img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bg)}
.shot .cap{padding:8px 10px;display:grid;gap:2px}
.shot .cap b{font-size:14px}
.lb{position:fixed;inset:0;background:rgba(8,10,6,.92);display:grid;place-items:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:86vh;object-fit:contain}
.lb p{color:#e3e8da;margin:8px 0 0;text-align:center}
@media (prefers-reduced-motion:no-preference){.q{transition:border-color .2s}}
</style>

ot in this view."}, {"element": "E5", "title": "Stone and peeling plaster", "url": "/_blob/c6667ebaa3d33aebce483f690ecc673f", "date": "2026-10-30", "caption": "Your texture.jpg as the base, the procedural peeling layer on top."}, {"element": "Assembly", "title": "First assembled view (in progress)", "url": "/_blob/4037519eab18e5aba8de1a1e9ec26b25", "date": "2026-10-30", "caption": "Main file through the matched camera: shell, roof, windows, entrance and mural. Still to come: the reworked keystone, the new street kit, the mural re-fit, the arched-window rebuild and scene lighting."}, {"element": "E6", "title": "Street kit vs bible", "url": "/_blob/c82f51e258eb1152a77b6f25d5d77880", "date": "2026-10-30", "caption": "Cabinet, awning, chalkboard, corner signs, bollards, wet cobbles and leaf litter."}, {"element": "E6", "title": "Corner wall signs", "url": "/_blob/23862e991edcea6b098b78da6f600043", "date": "2026-10-30", "caption": "TOKENS / REGRETS plaque (your Q-005 ruling) and the TOKENS / DRINKS / GAMES / REGRETS board."}, {"element": "E6", "title": "Arcade cabinet", "url": "/_blob/70f9aff95bffeb75e83616894fe9c200", "date": "2026-10-30", "caption": "Sticker-bombed cabinet with the ABSINTHE ARCADE marquee."}], "lastSubmit": "2026-10-28 21:23"}</script>

      if(q.context)h+='<p class="ctx">'+esc(q.context)+'</p>';
      if(q.options&&q.options.length){h+='<ul>';q.options.forEach(function(o){h+='<li>'+esc(o)+'</li>';});h+='</ul>';}
      h+='<label for="ans-'+esc(q.id)+'">Your answer</label><textarea id="ans-'+esc(q.id)+'" data-q="'+esc(q.id)+'" placeholder="Type your ruling. Leave blank to keep it open.">'+esc(getDraft(q.id))+'</textarea></article>';});
      h+='</div>';}
    h+='</section>';

    if(open.length){h+='<div class="bar"><span class="note" id="barnote">'+(readOnly?'This view is read-only.':'Drafts are kept on this device until you submit.')+'</span><button id="submit" '+(readOnly?'disabled':'')+'>Submit answers</button></div>';}

    h+='<section><details class="log"><summary>Answered ('+done.length+')</summary>';
    if(!done.length)h+='<p class="note">No answers yet.</p>';
    done.forEach(function(q){h+='<div class="ans"><span class="label">'+esc(q.id)+' · '+esc(q.agent)+' · '+esc(q.status==='relayed'?'relayed to agent':'awaiting relay')+'</span><span>'+esc(q.question)+'</span><span class="a">'+esc(q.answer)+'</span></div>';});
    h+='</details></section>';

    h+='<section><h2>Completed work</h2>';
    if(!STATE.gallery.length){h+='<p class="empty">Renders of finished elements appear here, newest first, each next to the reference crop it was judged against.</p>';}
    else{h+='<div class="gallery">';STATE.gallery.slice().reverse().forEach(function(g,i){
      h+='<figure class="shot" style="margin:0"><button data-img="'+esc(g.url)+'" data-cap="'+esc(g.title)+'"><img loading="lazy" src="'+esc(g.url)+'" alt="'+esc(g.title)+'"></button><figcaption class="cap"><b>'+esc(g.title)+'</b><span class="label">'+esc(g.element)+' · '+esc(g.date)+'</span>'+(g.caption?'<span class="note">'+esc(g.caption)+'</span>':'')+'</figcaption></figure>';});
      h+='</div>';}
    h+='</section>';
    app.innerHTML=h;

    app.querySelectorAll('textarea[data-q]').forEach(function(t){t.addEventListener('input',function(){setDraft(t.dataset.q,t.value);});});
    var sb=document.getElementById('submit'); if(sb)sb.addEventListener('click',submit);
    app.querySelectorAll('.shot button').forEach(function(b){b.addEventListener('click',function(){openLb(b.dataset.img,b.dataset.cap);});});
  }

  function openLb(src,cap){
    var d=document.createElement('div');d.className='lb';d.tabIndex=-1;
    d.innerHTML='<div><img src="'+esc(src)+'" alt="'+esc(cap)+'"><p>'+esc(cap)+' · click or press Esc to close</p></div>';
    function close(){d.remove();document.removeEventListener('keydown',k);}
    function k(e){if(e.key==='Escape')close();}
    d.addEventListener('click',close);document.addEventListener('keydown',k);
    document.body.appendChild(d);d.focus();
  }

  function buildDoc(state){
    var css=document.getElementById('css').textContent;
    var js=document.getElementById('appjs').textContent;
    var json=JSON.stringify(state).replace(/</g,'\\u003c');
    var reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
      '<title>Absinthe Arcade Build Desk</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<style id="css">'+css+'</style>\n'+
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@400&display=swap">\n'+
      '<div class="wrap" id="app"><p class="empty">Loading the build desk…</p></div>\n'+
      '<script type="application/json" id="state">'+json+'</scr'+'ipt>\n<script id="appjs">'+js+'</scr'+'ipt>'+
      '</body></html>';
  }

  function submit(){
    var sb=document.getElementById('submit'), note=document.getElementById('barnote');
    var now=new Date().toISOString().slice(0,16).replace('T',' ');
    var next=JSON.parse(JSON.stringify(STATE)), n=0;
    next.questions.forEach(function(q){
      if(q.status!=='open')return;
      var el=document.getElementById('ans-'+q.id), v=el?el.value.trim():'';
      if(v){q.answer=v;q.status='answered';q.answered=now;n++;}
    });
    if(!n){note.textContent='Type at least one answer first.';return;}
    if(!artifactNs){note.textContent='Saving is not available in this view. Your drafts are kept on this device.';return;}
    next.updated=now; next.lastSubmit=now;
    sb.disabled=true; note.textContent='Sending '+n+' answer'+(n>1?'s':'')+' to the crew…';
    var lines=next.questions.filter(function(q){return q.status==='answered'&&q.answered===now;}).map(function(q){return q.id+' ('+q.agent+'): '+q.answer;});
    var msg=('AUTHOR SUBMITTED ANSWERS '+now+'\n'+lines.join('\n')).slice(0,3800);
    var ping=commentsNs?commentsNs.anchorFor(sb).then(function(an){return commentsNs.sendToClaude({anchor:an,text:msg});}).catch(function(){}):Promise.resolve();
    ping.then(function(){return artifactNs.publish(buildDoc(next));}).then(function(){
      next.questions.forEach(function(q){if(q.status==='answered')dropDraft(q.id);});
    },function(err){
      var c=err&&err.code;
      if(c==='conflict'){note.textContent='The desk changed while you were typing. It is reloading; your drafts are kept on this device.';return;}
      if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'){readOnly=true;note.textContent='This view is read-only, so answers cannot be saved here.';return;}
      sb.disabled=false; note.textContent='Saving failed ('+(c||'unknown')+'). Try again in a moment; drafts are kept.';
    });
  }

  STATE.questions.forEach(function(q){if(q.status!=='open')dropDraft(q.id);});
  render();
  if(window.claude&&window.claude.use){
    window.claude.use('artifact').then(function(a){artifactNs=a;},function(){});
    window.claude.use('comments').then(function(c){commentsNs=c;},function(){});
  }
})();
</script>
